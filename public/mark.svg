<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Group Network</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ee7d1"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="#0b0d12"/>
  <!-- Two node types wired together: the network model in miniature. -->
  <g stroke="url(#g)" stroke-width="1.6" opacity="0.85">
    <line x1="9" y1="11" x2="23" y2="10"/>
    <line x1="9" y1="11" x2="16" y2="22"/>
    <line x1="23" y1="10" x2="16" y2="22"/>
  </g>
  <circle cx="9" cy="11" r="3.4" fill="#6ee7d1"/>
  <circle cx="23" cy="10" r="3.4" fill="#a78bfa"/>
  <circle cx="16" cy="22" r="3.4" fill="#6ee7d1"/>
</svg>
